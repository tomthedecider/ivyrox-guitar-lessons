# Render Blueprint: deploy this repo with "New +" -> "Blueprint" in the
# Render dashboard, pointing at this repo. It provisions two independent
# web services from the two branches below, each with its own URL, so dev
# work can be reviewed before it ever reaches the prod service.
#
# region: frankfurt on both — the primary/daily user is in Munich, so the
# app server should sit close to her and to the Neon databases (also in
# Frankfurt), keeping the frequent app<->DB round trips fast. The
# occasional/secondary user is farther away; that single extra hop is an
# accepted tradeoff. Render can't change a service's region after
# creation — if these services already exist in a different region,
# delete them in the dashboard first, then re-sync this Blueprint to
# recreate them fresh in Frankfurt.
#
# DATABASE_URL is intentionally left unset here (`sync: false`) rather
# than hardcoded — it's a Postgres connection string with real
# credentials, so it shouldn't live in the repo. Render will prompt you
# to fill it in per-service during Blueprint sync, or you can set/update
# it later under each service's Environment tab. Use two SEPARATE
# Postgres databases (one per service) — see this repo's README,
# "Persistence", for how to get connection strings (Neon is the
# recommended free host) and exactly what to paste where.
#
# PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true skips the advisory lock
# `prisma migrate deploy` normally takes before running — that lock
# exists to stop two migrations racing each other, but each service here
# runs a single instance with one deploy at a time, so the risk it
# guards against doesn't apply. Worth keeping this in mind if that ever
# changes (e.g. multiple replicas): re-enable the lock by removing this
# var. Without it, deploys intermittently failed with a P1002 timeout —
# Prisma's 10-second wait for the lock is hardcoded and not reliable
# against Neon's free-tier compute waking from an idle suspend.
services:
  - type: web
    name: ivyrox-dev
    runtime: docker
    region: frankfurt
    branch: develop
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "true"

  - type: web
    name: ivyrox-prod
    runtime: docker
    region: frankfurt
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "true"
