# Render Blueprint: deploy this repo with "New +" -> "Blueprint" in the
# Render dashboard, pointing at this repo. It provisions two independent
# web services from the two branches below, each with its own URL, so dev
# work can be reviewed before it ever reaches the prod service.
#
# DATABASE_URL is intentionally left unset here (`sync: false`) rather
# than hardcoded — it's a Postgres connection string with real
# credentials, so it shouldn't live in the repo. Render will prompt you
# to fill it in per-service during Blueprint sync, or you can set/update
# it later under each service's Environment tab. Use two SEPARATE
# Postgres databases (one per service) — see this repo's README,
# "Persistence", for how to get connection strings (Neon is the
# recommended free host) and exactly what to paste where.
services:
  - type: web
    name: ivyrox-dev
    runtime: docker
    branch: develop
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"

  - type: web
    name: ivyrox-prod
    runtime: docker
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
